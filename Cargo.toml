[package]
name = "priority-queue-redis"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "producer"
path = "src/main.rs"

[[bin]]
name = "worker"
path = "worker/main.rs"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
rand = "0.9.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
redis = "0.32.6"    
dotenv = "0.15.0"